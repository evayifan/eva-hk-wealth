    &lt;section class=&quot;pi-subpage&quot; id=&quot;pi-fcn-guide-view&quot; aria-labelledby=&quot;pi-fcn-guide-view-title&quot; hidden&gt;
      &lt;header class=&quot;pi-subbar&quot;&gt;
        &lt;button class=&quot;pi-back&quot; data-back aria-label=&quot;返回投資者教育&quot;&gt;&lt;i data-lucide=&quot;chevron-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
        &lt;h2 id=&quot;pi-fcn-guide-view-title&quot;&gt;FCN指南&lt;/h2&gt;
        &lt;span&gt;&lt;/span&gt;
      &lt;/header&gt;
      &lt;div class=&quot;pi-subcontent pi-guide-content&quot;&gt;
        &lt;p class=&quot;pi-guide-intro&quot;&gt;固定票息票據是與一項或多項相關資產表現掛鈎的結構性產品。以下以常見股票掛鈎結構作教育示例，實際條款以產品文件為準。&lt;/p&gt;
        &lt;details open&gt;&lt;summary&gt;&lt;span&gt;01&lt;/span&gt;FCN 是甚麼&lt;/summary&gt;&lt;div&gt;&lt;p&gt;FCN 通常在指定期限內按條款派發固定票息；本金如何償還，則視乎相關資產價格、行使價、提前贖回水平及到期安排。&lt;/p&gt;&lt;p&gt;它並非定期存款，也不等同持有一般債券；回報上限通常受票息限制，而本金可能承受市場及發行人信貸風險。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
        &lt;details&gt;&lt;summary&gt;&lt;span&gt;02&lt;/span&gt;FCN 如何運作&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;設定條款&lt;/b&gt;&lt;small&gt;選定相關資產、期限、票息、行使價與提前贖回水平。&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;定期觀察&lt;/b&gt;&lt;small&gt;在觀察日比較相關資產價格與提前贖回水平。&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;提前贖回或延續&lt;/b&gt;&lt;small&gt;達到條款所定水平時或會提早結束，否則持續至下一觀察日或到期。&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;到期結算&lt;/b&gt;&lt;small&gt;按最終價格與行使價的關係，以現金或相關資產結算。&lt;/small&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;
        &lt;details&gt;&lt;summary&gt;&lt;span&gt;03&lt;/span&gt;FCN 優勢與風險&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;pi-guide-split&quot;&gt;&lt;section&gt;&lt;b&gt;可能優勢&lt;/b&gt;&lt;ul&gt;&lt;li&gt;在窄幅或溫和上升市況下提供票息收入機會&lt;/li&gt;&lt;li&gt;條款可按期限、資產及風險承受程度設計&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section&gt;&lt;b&gt;主要風險&lt;/b&gt;&lt;ul&gt;&lt;li&gt;非保本，最差情況可能損失全部本金&lt;/li&gt;&lt;li&gt;上升收益通常封頂，並可能被提前贖回&lt;/li&gt;&lt;li&gt;涉及相關資產、市場、流動性及發行人信貸風險&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
        &lt;details&gt;&lt;summary&gt;&lt;span&gt;04&lt;/span&gt;FCN 情景案例&lt;/summary&gt;&lt;div&gt;&lt;p&gt;假設相關股票初始價為 HK$100、行使價為 HK$80、提前贖回水平為 HK$103；票息及所有數值僅作示意。&lt;/p&gt;&lt;div class=&quot;pi-scenario-list&quot;&gt;&lt;section&gt;&lt;b&gt;情景 A · 提前贖回&lt;/b&gt;&lt;small&gt;觀察日價格為 HK$105，達到提前贖回水平；產品按條款提早結束，投資者收回本金及應計票息。&lt;/small&gt;&lt;/section&gt;&lt;section&gt;&lt;b&gt;情景 B · 到期收回本金&lt;/b&gt;&lt;small&gt;未曾提前贖回，到期價格為 HK$90，高於行使價；按示例條款以現金償還本金及應計票息。&lt;/small&gt;&lt;/section&gt;&lt;section&gt;&lt;b&gt;情景 C · 本金虧損&lt;/b&gt;&lt;small&gt;到期價格為 HK$65，低於行使價；投資者或按條款收取相關股票或等值現金，並承受相對本金的損失。&lt;/small&gt;&lt;/section&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
        &lt;p class=&quot;pi-guide-disclaimer&quot;&gt;本指南只作教育及介面示例，不構成要約、招攬或投資建議。投資前應閱讀條款文件、最差情景分析及風險披露。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/section&gt;

  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
